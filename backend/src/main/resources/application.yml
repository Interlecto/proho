spring:
  application:
    name: proho
  datasource:
    url: ${PROHO_DB_URL:jdbc:postgresql://localhost:5432/proho}
    username: ${PROHO_DB_USER:proho}
    password: ${PROHO_DB_PASSWORD:proho}
  flyway:
    locations: classpath:db/migration

proho:
  auth:
    session-ttl: ${PROHO_SESSION_TTL:30d}
    password-reset-token-ttl: ${PROHO_PASSWORD_RESET_TOKEN_TTL:1h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
