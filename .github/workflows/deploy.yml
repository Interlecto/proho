name: Deploy

# After CI passes on master: build the backend image, push it to GHCR, and
# deploy it to the server (docs/operations/deployment.md). Also runnable by
# hand on master, e.g. to deploy again after fixing the server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/interlecto/proho-backend
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  image:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.COMMIT }}
            ${{ env.IMAGE }}:master
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Skipped until a server exists: set the repository variable
    # PROHO_DEPLOY_HOST to turn it on.
    if: vars.PROHO_DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    # Holds the deploy key; configure it with required reviewers so each
    # deployment waits for approval.
    environment: production
    steps:
      - name: Deploy through the forced-command key
        env:
          HOST: ${{ vars.PROHO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.PROHO_DEPLOY_USER || 'proho-deploy' }}
          SSH_KEY: ${{ secrets.PROHO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROHO_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's authorized_keys runs proho-deploy whatever is sent;
          # the commit is its only input.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$HOST" "$COMMIT"
