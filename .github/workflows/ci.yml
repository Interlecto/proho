name: CI

on:
  push:
    branches: [master, "develop/**"]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: proho-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

  # ProHoKit is platform-independent; testing it on Linux keeps it buildable
  # with the Windows/Linux toolchains used for day-to-day editing.
  ios-kit-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    defaults:
      run:
        working-directory: ios/ProHoKit
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ProHoKit
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build
          -project ProHo.xcodeproj
          -scheme ProHo
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
