openapi: 3.0.3
info:
  title: ProHo API
  description: >
    Shared REST contract for the ProHo backend. Grows module by module,
    alongside the backend; see docs/architecture/domain-model.md for the
    entities and docs/development.md for the branch workflow.
  version: "0.1"

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.ilecto.net/proho
    description: Production (see docs/infrastructure.md)

paths:
  /accounts:
    post:
      summary: Register an account
      description: >
        Creates a platform login (identity module). The account starts
        `pending_verification`; it holds no community data of its own —
        see docs/architecture/domain-model.md §3.
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid request (bad email, password too short, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >
            Invalid email or password. The same error is returned whether
            the email is unregistered or the password is wrong, and for a
            locked or closed account, so the response never confirms
            whether an email is registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
        "401":
          description: Missing, invalid, expired or already-revoked token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    get:
      summary: The authenticated account
      description: >
        Will later also expose, per docs/architecture/domain-model.md
        §10.1, which modules and capabilities are enabled; this first
        version returns only account fields.
      operationId: getCurrentAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Change the account's display name and language
      operationId: updateCurrentAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/password-reset/request:
    post:
      summary: Request a password-reset token
      description: >
        Always returns 202, whether or not the email matches an eligible
        account, so the response never confirms whether an email is
        registered. Delivery of the token (by email) is not yet
        implemented; see the notifications module.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "202":
          description: Request accepted
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/password-reset/confirm:
    post:
      summary: Apply a new password using a reset token
      description: >
        Revokes every existing session for the account on success.
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPasswordResetRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: >
            Invalid request, or the token is missing, already used or
            expired — one error for all three, so the response never
            confirms which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities:
    post:
      summary: Create a community
      description: >
        The caller becomes its founding administrator in the same transaction.
      operationId: createCommunity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Community"
        "400":
          description: >-
            `invalid_request` or `unsupported_community_kind`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `community_key_already_registered`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: The communities where the caller is an active member
      operationId: listCommunities
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Community"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}:
    get:
      summary: Read a community
      operationId: getCommunity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Community"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Edit a community (administrator)
      description: >
        Replaces the editable fields. The key, kind, plan, country, currency and time zone stay fixed.
      operationId: updateCommunity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommunityRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Community"
        "400":
          description: >-
            Invalid request (`invalid_request`, or a more specific code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/membership:
    get:
      summary: The caller's membership and assigned roles
      description: >
        Lets a client show only what the caller can do. Roles derived from unit relationships are not included.
      operationId: getMyMembership
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyMembership"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/buildings:
    post:
      summary: Create a building (administrator)
      operationId: createBuilding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "400":
          description: >-
            Invalid request (`invalid_request`, or a more specific code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List the community's buildings
      operationId: listBuildings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/includeArchived"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Building"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/buildings/{buildingId}:
    get:
      summary: Read a building
      operationId: getBuilding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/buildingId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`: an id in the path is not in this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Replace a building (administrator)
      operationId: updateBuilding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/buildingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "400":
          description: >-
            Invalid request (`invalid_request`, or a more specific code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`: an id in the path is not in this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `record_archived`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/buildings/{buildingId}/archive:
    post:
      summary: Archive a building (administrator)
      description: >
        Blocked while it has active units.
        Idempotent: archiving an archived record, or restoring an active one, changes nothing.
      operationId: archiveBuilding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/buildingId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`: an id in the path is not in this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `building_in_use`: it still has active units
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/buildings/{buildingId}/restore:
    post:
      summary: Restore an archived building (administrator)
      description: >
        Idempotent: archiving an archived record, or restoring an active one, changes nothing.
      operationId: restoreBuilding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/buildingId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`: an id in the path is not in this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/units:
    post:
      summary: Create a unit (administrator)
      operationId: createUnit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          description: >-
            `invalid_request`, `unsupported_unit_kind`, or `not_found_in_community` for a building outside this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `unit_number_already_registered`, which includes archived units, or `record_archived` for an archived building
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List the community's units
      operationId: listUnits
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/includeArchived"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/units/{unitId}:
    get:
      summary: Read a unit
      operationId: getUnit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`: an id in the path is not in this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Replace a unit (administrator)
      operationId: updateUnit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/unitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          description: >-
            `invalid_request`, `unsupported_unit_kind`, or `not_found_in_community` for a building outside this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`: an id in the path is not in this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `unit_number_already_registered`, which includes archived units, or `record_archived`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/units/{unitId}/archive:
    post:
      summary: Archive a unit (administrator)
      description: >
        Blocked while it has a relationship with no end date, or one ending after today.
        Idempotent: archiving an archived record, or restoring an active one, changes nothing.
      operationId: archiveUnit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`: an id in the path is not in this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `unit_in_use`: it still has an open relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/units/{unitId}/restore:
    post:
      summary: Restore an archived unit (administrator)
      description: >
        Idempotent: archiving an archived record, or restoring an active one, changes nothing.
      operationId: restoreUnit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/unitId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`: an id in the path is not in this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `record_archived`: its building is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/people:
    post:
      summary: Create a person (administrator)
      operationId: createPerson
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: >-
            Invalid request (`invalid_request`, or a more specific code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held` for an action that needs a role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `person_id_already_registered`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List the people the caller may see
      description: >
        Members see themselves, people on their units, and people who chose to share
        their name. See docs/security/privacy.md.
      operationId: listPeople
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/includeArchived"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
