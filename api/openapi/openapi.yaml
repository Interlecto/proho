            `role_not_assigned` or `last_administrator`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/memberships/{membershipId}/suspend:
    post:
      summary: Suspend a member (administrator)
      description: >
        Blocks all access to the community on their next request. Idempotent.
      operationId: suspendMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/membershipId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `last_administrator`: the community must keep an active administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/memberships/{membershipId}/reactivate:
    post:
      summary: Reactivate a suspended member (administrator)
      description: >
        Idempotent.
      operationId: reactivateMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/membershipId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/memberships/{membershipId}/remove:
    post:
      summary: Remove a member (administrator)
      description: >
        Ends the membership and its roles. They can only return through a new invitation.
      operationId: removeMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - $ref: "#/components/parameters/membershipId"
      responses:
        "204":
          description: Success
        "401":
          description: >-
            Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            `not_found_in_community`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `last_administrator`: the community must keep an active administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /communities/{communityId}/audit-events:
    get:
      summary: The community's audit log, newest first (administrator or auditor)
      description: >
        Only this community's events: platform events such as logins aren't included.
        Every API response carries the id of its request in an X-Request-Id header,
        which matches the requestId of the events it wrote.
      operationId: listAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/communityId"
        - name: before
          in: query
          description: The id of the last event of the previous page.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            `membership_not_active`, or `role_not_held`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    invitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    role:
      name: role
      in: path
      required: true
      schema:
        type: string
        enum: [administrator, accountant, treasurer, auditor, council_member, moderator, staff]
    membershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    communityId:
      name: communityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    buildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    unitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    personId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    relationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    includeArchived:
      name: includeArchived
      in: query
      description: Also return archived records. Requires the administrator role.
      schema:
        type: boolean
        default: false

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    RegisterAccountRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Never returned; stored as a password hash.
        displayName:
          type: string
          maxLength: 200
        locale:
          type: string
          maxLength: 10
          default: es-CO

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        locale:
          type: string
        status:
          type: string
          enum: [pending_verification, active, locked, closed]

    Error:
      type: object
      properties:
        error:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 72

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 'Opaque bearer token. Send as "Authorization: Bearer <token>".'
        expiresAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"

    RequestPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320

    ConfirmPasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: Never returned; stored as a password hash.

    CreateCommunityRequest:
      type: object
      required: [key, name, kind]
      properties:
        key:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
          description: Unique across the platform. Can't be changed later.
        name:
          type: string
          maxLength: 200
        legalName:
          type: string
          maxLength: 200
        taxId:
          type: string
          maxLength: 32
        kind:
          type: string
          enum: [ph_residential]
        plan:
          type: string
          maxLength: 40
        country:
          type: string
          minLength: 2
          maxLength: 2
          default: CO
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: COP
        timezone:
          type: string
          maxLength: 64
          default: America/Bogota
          description: An IANA time zone.
        address:
          type: string

    UpdateCommunityRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        legalName:
          type: string
          maxLength: 200
        taxId:
          type: string
          maxLength: 32
        address:
          type: string

    Community:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        legalName:
          type: string
          nullable: true
        taxId:
          type: string
          nullable: true
        kind:
          type: string
        plan:
          type: string
          nullable: true
        country:
          type: string
        currency:
          type: string
        timezone:
          type: string
        address:
          type: string
          nullable: true

    UpdateAccountRequest:
      type: object
      required: [displayName, locale]
      properties:
        displayName:
          type: string
          maxLength: 200
        locale:
          type: string
          maxLength: 10

    Visibility:
      type: string
      enum: [privileged, community]
      default: privileged
      description: >
        Who else can see this: privileged roles only, or any member of the community.
        See docs/security/privacy.md.

    UpdateProfileRequest:
      type: object
      required: [nameVisibility, emailVisibility, phoneVisibility, unitsVisibility]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          maxLength: 40
        nameVisibility:
          $ref: "#/components/schemas/Visibility"
        emailVisibility:
          $ref: "#/components/schemas/Visibility"
        phoneVisibility:
          $ref: "#/components/schemas/Visibility"
        unitsVisibility:
          $ref: "#/components/schemas/Visibility"

    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        action:
          type: string
        summary:
          type: string
          nullable: true
          description: Never holds a person's name, document or contact details.
        actorName:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true

    CreateInvitationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        personId:
          type: string
          format: uuid

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        personId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
          nullable: true
          description: Only in the response that creates the invitation. Never stored.

    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 100

    InvitationPreview:
      type: object
      properties:
        communityName:
          type: string
        email:
          type: string
          format: email
        matchesAccount:
          type: boolean

    AcceptedInvitation:
      type: object
      properties:
        communityId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
          nullable: true

    AssignRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [administrator, accountant, treasurer, auditor, council_member, moderator, staff]

    LinkPersonRequest:
      type: object
      properties:
        personId:
          type: string
          format: uuid
          nullable: true

    Member:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        personId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [invited, active, suspended]
        roles:
          type: array
          items:
            type: string

    MyMembership:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
          nullable: true
          description: The person record linked to this membership, if any.
        roles:
          type: array
          items:
            type: string
            enum: [administrator, accountant, treasurer, auditor, council_member, moderator, staff]

    BuildingRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200

    Building:
      type: object
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        name:
          type: string
        archivedAt:
          type: string
          format: date-time
          nullable: true

    UnitRequest:
      type: object
      required: [number, kind]
      properties:
        number:
          type: string
          maxLength: 40
          description: Unique within the community, including archived units.
        kind:
          type: string
          enum: [apartment, house, commercial, office, parking, storage]
        buildingId:
          type: string
          format: uuid
        floor:
          type: string
          maxLength: 20
        areaM2:
          type: number
          minimum: 0
          description: At most 8 integer and 2 decimal digits.
        registryId:
          type: string
          maxLength: 60

    Unit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
          nullable: true
        number:
          type: string
        kind:
          type: string
        floor:
          type: string
          nullable: true
        areaM2:
          type: number
          nullable: true
        registryId:
          type: string
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true

    PersonRequest:
      type: object
      required: [kind]
      description: >
        A natural person needs givenName and surname, and a legal person needs
        legalName. idType and idNumber go together, and are unique per community.
      properties:
        kind:
          type: string
          enum: [natural, legal]
        givenName:
          type: string
          maxLength: 120
        surname:
          type: string
          maxLength: 120
        legalName:
          type: string
          maxLength: 200
        idType:
          type: string
          enum: [CC, CE, NIT, PA, TI]
        idNumber:
          type: string
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          maxLength: 40

    Person:
      type: object
      description: >
        Fields the caller may not see are null, so a null doesn't mean the person has
        no value. See docs/security/privacy.md.
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        kind:
          type: string
        givenName:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        legalName:
          type: string
          nullable: true
        idType:
          type: string
          nullable: true
        idNumber:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        nameVisibility:
          $ref: "#/components/schemas/Visibility"
        emailVisibility:
          $ref: "#/components/schemas/Visibility"
        phoneVisibility:
          $ref: "#/components/schemas/Visibility"
        unitsVisibility:
          $ref: "#/components/schemas/Visibility"
        archivedAt:
          type: string
          format: date-time
          nullable: true

    CreateUnitRelationshipRequest:
      type: object
      required: [personId, role]
      properties:
        personId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, tenant, resident, household_member, representative]
        share:
          type: number
          minimum: 0
          maximum: 100
          description: Owners only, ignored for other roles. At most 4 decimals.
        validFrom:
          type: string
          format: date
          description: First day in force. Defaults to today in the community's time zone.
        validTo:
          type: string
          format: date
          description: Last day in force, inclusive.

    EndUnitRelationshipRequest:
      type: object
      properties:
        validTo:
          type: string
          format: date
          description: Last day in force, inclusive. Defaults to today in the community's time zone.

    UnitRelationship:
      type: object
      properties:
        id:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        role:
          type: string
        share:
          type: number
          nullable: true
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true
