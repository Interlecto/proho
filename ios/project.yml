# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). The .xcodeproj is
# generated from this file on a Mac and is NOT committed, so the project
# can be edited from any OS without hand-merging project.pbxproj:
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open ProHo.xcodeproj
#
# Re-run `xcodegen generate` after adding/removing files or editing this.
name: ProHo
options:
  bundleIdPrefix: app.ilecto
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  ProHoKit:
    path: ProHoKit
targets:
  ProHo:
    type: application
    platform: iOS
    sources:
      - path: ProHo
        excludes:
          - Info.plist
    dependencies:
      - package: ProHoKit
    settings:
      base:
        INFOPLIST_FILE: ProHo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
schemes:
  ProHo:
    build:
      targets:
        ProHo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ProHoKit/ProHoKitTests
    archive:
      config: Release
